name: Chup man hinh thu
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bat KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: mkdir -p app/src/main/assets/certs && curl -sSL https://letsencrypt.org/certs/isrgrootx1.pem -o app/src/main/assets/certs/isrgrootx1.pem
      - run: gradle assembleDebug --no-daemon
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1024x600
          disable-animations: true
          script: bash .github/shots.sh
      - name: Luu anh vao nhanh shots
        if: always()
        run: |
          cd /tmp/shots && git init -q && git checkout -q -b shots
          git -c user.name=bot -c user.email=bot@users.noreply.github.com add . && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm shots
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} shots
