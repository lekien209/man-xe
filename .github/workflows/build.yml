name: Dong goi APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Chung chi goc cho Android 6 (ISRG + chuoi chung chi GitHub va cac may chu app dung)
        run: |
          D=app/src/main/assets/certs; mkdir -p $D
          curl -sSL https://letsencrypt.org/certs/isrgrootx1.pem -o $D/isrgrootx1.pem
          curl -sSL https://letsencrypt.org/certs/isrg-root-x2.pem -o $D/isrgrootx2.pem
          for host in github.com api.github.com release-assets.githubusercontent.com objects.githubusercontent.com \
                      tile.openstreetmap.org a.tile.openstreetmap.fr nominatim.openstreetmap.org photon.komoot.io \
                      router.project-osrm.org api.open-meteo.com; do
            echo | openssl s_client -connect $host:443 -servername $host -showcerts 2>/dev/null \
              | awk -v d=$D -v h=$host '/BEGIN CERTIFICATE/{n++; on=1; f=d"/"h"-"n".pem"} on && n>1{print >> f} /END CERTIFICATE/{on=0}' || true
          done
          rm -f $D/*-1.pem; ls -l $D
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Dat ten file
        run: cp app/build/outputs/apk/debug/app-debug.apk ManXe-b${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ManXe-apk
          path: ManXe-b${{ github.run_number }}.apk
      - name: Dang len trang Releases (tai bang dien thoai)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ManXe-b${{ github.run_number }}.apk ManXe.apk
          gh release create b${{ github.run_number }} ManXe-b${{ github.run_number }}.apk ManXe.apk \
            --title "Màn xe bản ${{ github.run_number }}" \
            --notes "${{ github.event.head_commit.message }}" --latest
      - name: Luu APK vao nhanh apk
        run: |
          mkdir /tmp/out && cp ManXe-b${{ github.run_number }}.apk /tmp/out/ManXe-latest.apk
          cd /tmp/out && git init -q && git checkout -q -b apk
          git -c user.name=bot -c user.email=bot@users.noreply.github.com add . 
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "APK ban ${{ github.run_number }}"
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} apk
