name: Dong goi APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Tai chung chi ISRG cho Android 6
        run: mkdir -p app/src/main/assets/certs && curl -sSL https://letsencrypt.org/certs/isrgrootx1.pem -o app/src/main/assets/certs/isrgrootx1.pem
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ManXe-apk
          path: app/build/outputs/apk/debug/app-debug.apk
